ont-weight="400">serta format kolom.</text><line x1="592" y1="247" x2="604" y2="247" stroke="#087f8c" stroke-width="3"/><polygon points="604,247 597.0,251.0 597.0,243.0" fill="#087f8c"/><rect x="608" y="152" width="260" height="190" rx="18" fill="#ffffff" stroke="#d9e2ed"/><circle cx="645" cy="190" r="22" fill="#087f8c"/><text x="632" y="197" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="700">03</text><text x="630" y="246" font-family="Arial, sans-serif" font-size="21" fill="#14243b" font-weight="700">Analisis komponen</text><text x="630" y="284" font-family="Arial, sans-serif" font-size="17" fill="#54657a" font-weight="400">Pisahkan gambar, teks</text><text x="630" y="310" font-family="Arial, sans-serif" font-size="17" fill="#54657a" font-weight="400">dan bentuk layout.</text><line x1="872" y1="247" x2="884" y2="247" stroke="#087f8c" stroke-width="3"/><polygon points="884,247 877.0,251.0 877.0,243.0" fill="#087f8c"/><rect x="888" y="152" width="260" height="190" rx="18" fill="#ffffff" stroke="#d9e2ed"/><circle cx="925" cy="190" r="22" fill="#087f8c"/><text x="912" y="197" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="700">04</text><text x="910" y="246" font-family="Arial, sans-serif" font-size="21" fill="#14243b" font-weight="700">Siapkan bahan</text><text x="910" y="284" font-family="Arial, sans-serif" font-size="17" fill="#54657a" font-weight="400">Ekstrak atau rekonstruksi;</text><text x="910" y="310" font-family="Arial, sans-serif" font-size="17" fill="#54657a" font-weight="400">simpan asal setiap aset.</text><rect x="888" y="402" width="260" height="190" rx="18" fill="#ffffff" stroke="#d9e2ed"/><circle cx="925" cy="440" r="22" fill="#087f8c"/><text x="912" y="447" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="700">05</text><text x="910" y="496" font-family="Arial, sans-serif" font-size="21" fill="#14243b" font-weight="700">Periksa bahan</text><text x="910" y="534" font-famil