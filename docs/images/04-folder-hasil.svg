<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087f8c"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/><text x="48" y="65" font-family="Arial, sans-serif" font-size="36" fill="#14243b" font-weight="700">Hasil akhir mudah ditemukan</text><text x="48" y="103" font-family="Arial, sans-serif" font-size="19" fill="#54657a" font-weight="400">Nama file mengikuti jenis desain yang benar-benar ada dan ukuran isi produk.</text><rect x="48" y="151" width="555" height="466" rx="18" fill="#ffffff" stroke="#d9e2ed"/><text x="72" y="195" font-family="Arial, sans-serif" font-size="24" fill="#087f8c" font-weight="700">PRODUK-DEMO-10-ML/</text><text x="80" y="239" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">01-bahan/</text><text x="80" y="277" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">    gambar/  vektor/  teks/</text><text x="80" y="315" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">02-affinity/</text><text x="80" y="353" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">    INNER DAN LABEL DEMO 10 ML.af</text><text x="80" y="391" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">03-pdf/</text><text x="80" y="429" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">    INNER DAN LABEL DEMO 10 ML.pdf</text><text x="80" y="467" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">04-preview/</text><text x="80" y="505" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">05-referensi/</text><text x="80" y="543" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">BUKA-DULU.md</text><rect x="650" y="151" width="500" height="220" rx="18" fill="#ffffff" stroke="#d9e2ed"/><text x="676" y="195" font-family="Arial, sans-serif" font-size="24" fill="#14243b" font-weight="700">Pilih awalan sesuai isi file</text><text x="676" y="235" font-family="Arial, sans-serif" font-size="18" fill="#54657a" font-weight="400">INNER: hanya desain inner/dus.</text><text x="676" y="265" font-family="Arial, sans-serif" font-size="18" fill="#54657a" font-weight="400">LABEL: hanya desain label.</text><text x="676" y="295" font-family="Arial, sans-serif" font-size="18" fill="#54657a" font-weight="400">INNER DAN LABEL: satu file memuat</text><text x="676" y="325" font-family="Arial, sans-serif" font-size="18" fill="#54657a" font-weight="400">keduanya. File terpisah dinamai sendiri.</text><rect x="650" y="396" width="500" height="221" rx="18" fill="#ffffff" stroke="#d9e2ed"/><text x="676" y="440" font-family="Arial, sans-serif" font-size="24" fill="#14243b" font-weight="700">Varian dan pemeriksaan</text><text x="676" y="480" font-family="Arial, sans-serif" font-size="18" fill="#54657a" font-weight="400">Versi 6 ml dan 10 ml disimpan terpisah.</text><text x="676" y="510" font-family="Arial, sans-serif" font-size="18" fill="#54657a" font-weight="400">Preview berasal dari master revisi sama.</text><text x="676" y="540" font-family="Arial, sans-serif" font-size="18" fill="#54657a" font-weight="400">Buka ulang master dan cek PDF.</text><text x="676" y="570" font-family="Arial, sans-serif" font-size="18" fill="#54657a" font-weight="400">ZIP dibuat hanya jika diminta.</text><text x="50" y="670" font-family="Arial, sans-serif" font-size="20" fill="#54657a" font-weight="400">Struktur folder adalah contoh. Sesuaikan dengan keluaran dan jenis kemasan.</text></svg>